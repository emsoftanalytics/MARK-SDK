name: Feature request
description: Suggest an improvement to the local SDK
title: "[feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas welcome — especially ones grounded in a real agent workload you're building.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the agent/memory workflow where the SDK falls short.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like MARK to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What are you doing today instead?
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: This can be exercised through the public SDK API
          required: false
        - label: This does not add heavy generated-media dependencies to package extras
          required: false
